[package]
name = "actinv-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "ACTINV core: sparse Bateman/CRAM solver"

[dependencies]
num-complex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
actinv-data = { path = "../actinv-data" }
libm = "0.2"

[[bin]]
name = "cram_probe"
path = "src/bin/cram_probe.rs"
