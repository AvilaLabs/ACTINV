<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore ACTINV activation results, compare inventories and decay heat, and prepare calculation inputs in your browser.">
  <title>ACTINV workbench · Avila Labs</title>
  <link data-trunk rel="rust" data-target-name="actinv_web" data-cargo-no-default-features data-wasm-opt="z">
  <style>
    :root { font-family: system-ui, sans-serif; color: #172038; background: #f7f8fc; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { display: flex; flex-direction: column; }
    header { min-height: 48px; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid #dce0eb; background: white; }
    header strong { color: #1800ad; }
    nav { display: flex; flex-wrap: wrap; gap: 18px; font-size: 14px; }
    a { color: #1800ad; text-underline-offset: 3px; }
    #actinv-canvas { display: block; width: 100%; flex: 1; min-height: 0; }
    #loading { position: absolute; inset: 49px 0 0; display: grid; place-content: center; padding: 24px; background: #f7f8fc; text-align: center; }
    #loading p { max-width: 500px; line-height: 1.6; color: #596478; }
    @media (max-width: 600px) { header { padding: 10px; } nav { gap: 10px; font-size: 12px; } }
  </style>
</head>
<body>
  <header><strong>ACTINV · Avila Labs</strong><nav aria-label="Resources"><a href="./download/">Download desktop</a><a href="https://github.com/AvilaLabs/ACTINV/blob/master/docs/WEB.md">Help</a><a href="https://github.com/AvilaLabs/ACTINV">GitHub</a></nav></header>
  <canvas id="actinv-canvas" aria-label="ACTINV workbench: open result files, compare plots, and edit problem specifications"></canvas>
  <div id="loading"><div><h1>Opening ACTINV…</h1><p>Explore results and prepare problems. Your files stay in this browser. Use the desktop app to run activation calculations.</p><noscript>Enable JavaScript to use the workbench, or <a href="./download/">download ACTINV</a>.</noscript></div></div>
  <script>
    window.addEventListener('unhandledrejection', () => {
      const loading = document.getElementById('loading');
      if (loading) loading.textContent = 'ACTINV could not start. Reload the page, or use the desktop download above.';
    });
  </script>
</body>
</html>
