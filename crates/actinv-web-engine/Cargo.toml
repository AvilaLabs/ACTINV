[package]
name = "actinv-web-engine"
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "ACTINV in a browser web worker: runs a problem from a library pack"

[lib]
name = "actinv_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
actinv-core = { path = "../actinv-core", version = "=1.7.2" }
serde_json = { version = "1", features = ["float_roundtrip"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["DedicatedWorkerGlobalScope", "MessageEvent", "Response", "WorkerGlobalScope"] }
