[package]
name = "actinv-py"
version = "1.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Python interface for the ACTINV nuclide-inventory solver"
repository = "https://github.com/AvilaLabs/ACTINV"

[lib]
name = "actinv"
crate-type = ["cdylib"]

[dependencies]
actinv-cli = { version = "=1.0.1", path = "../crates/actinv-cli" }
actinv-core = { version = "=1.0.1", path = "../crates/actinv-core" }
serde_json = "1"
num-complex = "0.4"
pyo3 = { version = "0.29", features = ["abi3-py39"] }
