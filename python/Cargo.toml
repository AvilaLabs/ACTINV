[package]
name = "actinv-py"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "ACTINV Python binding (PyO3)"

[lib]
name = "actinv"
crate-type = ["cdylib"]

[dependencies]
actinv-core = { path = "../crates/actinv-core" }
serde_json = "1"
num-complex = "0.4"
pyo3 = { version = "0.29", features = ["extension-module"] }
