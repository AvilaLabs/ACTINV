[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "actinv"
version = "1.0.1"
description = "Open, standalone nuclide-inventory and activation solver"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
requires-python = ">=3.9"
authors = [{ name = "Connor Avila", email = "Connoravila@gmail.com" }]
keywords = ["activation", "nuclear", "inventory", "decay-heat", "neutronics"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/AvilaLabs/ACTINV"
Documentation = "https://github.com/AvilaLabs/ACTINV#readme"
Issues = "https://github.com/AvilaLabs/ACTINV/issues"
Repository = "https://github.com/AvilaLabs/ACTINV"

[project.scripts]
actinv = "actinv:_cli"

[tool.maturin]
bindings = "pyo3"
strip = true
