[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "actinv"
version = "0.0.1"
description = "ACTINV — open, standalone, activation-grade nuclide-inventory solver (Python binding)"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.9"

[tool.maturin]
features = ["pyo3/extension-module"]
