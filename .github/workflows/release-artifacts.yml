name: release artifacts

# This workflow builds and retains candidate artifacts. It does not publish a package,
# create a GitHub Release, or create a tag.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  ACTINV_VERSION: "1.0.1"

jobs:
  linux-wheels:
    name: Python wheel / Linux / ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            before_script: "true"
          - target: aarch64-unknown-linux-gnu
            # ring's generated ARM assembly requires the target architecture macro
            # when using the manylinux2014 cross compiler.
            before_script: export CFLAGS_aarch64_unknown_linux_gnu="-D__ARM_ARCH=8"
    steps:
      - uses: actions/checkout@v7
      - name: Build source distribution
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          maturin-version: v1.15.0
          working-directory: python
          args: --out ../dist
      - name: Build stable-ABI wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.target }}
          manylinux: "2014"
          before-script-linux: ${{ matrix.before_script }}
          working-directory: python
          args: --release --locked --compatibility pypi --out ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: actinv-${{ env.ACTINV_VERSION }}-python-${{ matrix.target }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  native-wheels:
    name: Python wheel / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
            label: macos-x86_64
          - os: macos-15
            target: aarch64-apple-darwin
            label: macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Build stable-ABI wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.target }}
          working-directory: python
          args: --release --locked --compatibility pypi --out ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: actinv-${{ env.ACTINV_VERSION }}-wheel-${{ matrix.label }}
          path: dist/*.whl
          if-no-files-found: error

  standalone-binaries:
    name: Standalone binary / ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
            binary: target/x86_64-unknown-linux-gnu/release/actinv
          - os: macos-15-intel
            target: x86_64-apple-darwin
            label: macos-x86_64
            binary: target/x86_64-apple-darwin/release/actinv
          - os: macos-15
            target: aarch64-apple-darwin
            label: macos-aarch64
            binary: target/aarch64-apple-darwin/release/actinv
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            binary: target/x86_64-pc-windows-msvc/release/actinv.exe
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build and identify binary
        run: cargo build --locked --release --package actinv-cli --target ${{ matrix.target }}
      - name: Verify binary version
        run: ./${{ matrix.binary }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: actinv-${{ env.ACTINV_VERSION }}-${{ matrix.label }}
          path: |
            ${{ matrix.binary }}
            README.md
            LICENSE-MIT
            LICENSE-APACHE
          if-no-files-found: error
