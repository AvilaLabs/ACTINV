name: fns-iron
on:
  push: { branches: [master, main] }
  pull_request:
  workflow_dispatch:
jobs:
  measured-decay-heat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 1
      RUST_TEST_THREADS: 1
      RAYON_NUM_THREADS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: Build ACTINV CLI
        run: cargo build --release -p actinv-cli --bin actinv
      - name: Fetch and verify pinned release data
        run: target/release/actinv data fetch --output target/fns-data
      - name: Plotting dependency
        run: python -m pip install matplotlib
      - name: Execute experimental case and check evidence
        run: |
          if test -f results/fns-iron-001/comparison.json; then
            python controls/fns_iron.py --data-root target/fns-data --plot
          else
            python controls/fns_iron.py --data-root target/fns-data --plot --record
          fi
          python controls/test_fns_iron.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fns-iron-evidence
          path: target/fns-iron/run/
