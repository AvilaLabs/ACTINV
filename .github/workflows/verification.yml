name: verification tools

# Promote selected suites to PR/scheduled checks after measured hosted runs.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Verification suite
        type: choice
        default: properties
        options: [properties, kani, fuzz, mutants, loom, miri, all]
      extended:
        description: More generated cases and longer fuzz searches
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.98.1
      - name: Install selected tools in a bounded scope
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          sudo systemd-run --scope -p MemoryMax=6G -p MemorySwapMax=0 -p TasksMax=128 -p CPUQuota=200% -- setpriv --reuid "$(id -u)" --regid "$(id -g)" --init-groups --reset-env env PATH="$PATH" CARGO_BUILD_JOBS=1 RUST_TEST_THREADS=1 RAYON_NUM_THREADS=2 python3 scripts/install_verification_tools.py "$SUITE"
      - name: Check runner safety and execute the suite
        env:
          SUITE: ${{ inputs.suite }}
          EXTENDED: ${{ inputs.extended }}
        run: |
          args=()
          if [ "$EXTENDED" = true ]; then args+=(--extended); fi
          sudo systemd-run --scope -p MemoryMax=6G -p MemorySwapMax=0 -p TasksMax=128 -p CPUQuota=200% -- setpriv --reuid "$(id -u)" --regid "$(id -g)" --init-groups --reset-env env PATH="$PATH" CARGO_BUILD_JOBS=1 RUST_TEST_THREADS=1 RAYON_NUM_THREADS=2 python3 scripts/test_verify.py
          sudo systemd-run --scope -p MemoryMax=6G -p MemorySwapMax=0 -p TasksMax=128 -p CPUQuota=200% -- setpriv --reuid "$(id -u)" --regid "$(id -g)" --init-groups --reset-env env PATH="$PATH" CARGO_BUILD_JOBS=1 RUST_TEST_THREADS=1 RAYON_NUM_THREADS=2 python3 scripts/verify.py "$SUITE" "${args[@]}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: verification-${{ inputs.suite }}
          if-no-files-found: ignore
          path: |
            target/verification/*.json
            target/verification/kani-*.log
            target/verification/artifacts/
            target/verification/mutation/mutants.out/
