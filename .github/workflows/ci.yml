name: controls

# Builds the workspace and runs every control that does not need a bulk nuclear-data library.
# The data subset is fetched from its public host and pinned by SHA-256; nothing nuclear is stored in this repository.
on:
  push: { branches: [master, main] }
  pull_request:
  workflow_dispatch:

jobs:
  build-and-control:
    runs-on: ubuntu-latest
    env:
      ACTINV_CI_DATA: /tmp/actinv-ci-data
      ACTINV_CI_OUT: /tmp/actinv-ci
      ACTINV_P8_WORK: /tmp/actinv-p8
      ACTINV_P9_WORK: /tmp/actinv-p9
      ACTINV_P9_RESULTS: /tmp/actinv-p9-results
      ACTINV_P10_WORK: /tmp/actinv-p10
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2

      - name: Rust quality gates
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --all-features
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-targets --all-features

      - name: Build workspace
        run: cargo build --release --workspace

      - name: Unit probe (constant source, analytic answer)
        run: ./target/release/unit_probe

      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }

      - name: Python environment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: P18 metadata-only evidence seal
        run: python controls/check_g0_p18.py --no-write

      - name: P18 physical product-state identity evidence
        run: python controls/check_g1_p18.py --no-write

      - name: P18 complete corpus audit preserves the frozen G2 failure
        run: python controls/check_g2_p18.py --no-write

      - name: P16 typed-boundary control and independent verdict
        run: |
          python controls/g1_p16_quantities.py --no-write
          python controls/check_p16.py --no-write

      - name: P15 prepared-cache integrity and verdict
        env:
          ACTINV_BIN: target/release/actinv
          ACTINV_CACHE_DIR: /tmp/actinv-p15-ci-cache
        run: |
          python controls/g3_p15_cache_integrity.py
          git diff --exit-code -- results/p15_cache_integrity.json
          python controls/check_p15.py --no-write

      - name: CRAM coefficient control (G0 — needs no nuclear data)
        run: python controls/g0_cram_coefficients.py

      - name: Generated sources are reproducible
        run: |
          python controls/gen_cram.py
          git diff --exit-code -- crates/actinv-core/src/cram_coeffs.rs

      - name: Release notes carry every known limitation
        run: python controls/check_release_notes.py

      - name: Prior phase verdict evidence remains green
        run: python controls/check_prior_verdicts.py

      - name: CB1 competitive scorecard remains reproducible
        run: python controls/check_cb1.py --no-write

      - name: P17 open diagnostic evidence and cause ledger
        run: python controls/check_g4_p17.py --no-write

      - name: P17 held-out unseal authorization
        run: python controls/check_p17_unseal.py --no-write

      - name: P17 held-out failure evidence and post-failure diagnostics
        run: python controls/check_g5_p17.py --no-write

      - name: P17 formal closure preserves the frozen failure verdict
        run: python controls/check_p17.py --no-write

      - name: P14 performance close remains reproducible
        run: python controls/check_p14.py --no-write

      - name: P12 release metadata and documentation
        run: python controls/g5_p12_release.py --source-only

      - name: Rust release workflow contract
        run: python scripts/check_crates_release_workflow.py

      - name: P12 release payload evidence
        run: |
          python scripts/test_check_python_release_set.py
          python controls/test_check_p12.py
          python controls/check_p12.py --through-g5

      - name: No undeclared dependencies
        run: python controls/check_dependencies.py

      - name: P13 verified data-distribution contract
        env:
          ACTINV_BIN: target/release/actinv
        run: |
          python controls/g1_p13_data_distribution.py
          python controls/check_p13.py

      - name: Public examples are portable
        env:
          ACTINV_BIN: target/release/actinv
        run: python controls/check_public_examples.py

      - name: CI result tolerance regression
        run: python controls/test_ci_result.py

      - name: Fetch the pinned data subset
        run: bash scripts/fetch_ci_data.sh

      - name: Build the Python module
        run: |
          cd python
          maturin build --release --locked --out ../dist
          python ../scripts/smoke_python_wheel.py ../dist
          pip install ../dist/*.whl
          python -c "import actinv, pathlib, tomllib; expected=tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']; assert actinv.__version__ == expected"

      - name: Python binding Rust quality
        run: |
          cargo fmt --manifest-path python/Cargo.toml -- --check
          cargo check --manifest-path python/Cargo.toml --all-targets --all-features
          cargo clippy --manifest-path python/Cargo.toml --all-targets --all-features -- -D warnings

      - name: End-to-end spec through both entry points
        run: python controls/ci_end_to_end.py

      - name: P8 flux-import and mesh controls
        run: |
          python controls/g1_p8_canonical_rebin.py
          python controls/g2_p8_openmc.py
          python controls/g3_p8_mcnp.py
          python controls/g4_p8_provenance.py
          python controls/g5_p8_mesh_identity.py
          python controls/g6_p8_scaling_regression.py
          python controls/check_p8.py

      - name: P9 deterministic fission and coupled-mode subset
        run: |
          python controls/g2_p9_fission_matrix.py
          python controls/g3_p9_coupled_auto.py

      - name: P10 charged-projectile runtime contract
        run: python controls/g6_p10_projectile_runtime.py

      - name: P11 synthetic uncertainty and entry-point controls
        run: |
          python controls/g3_p11_sensitivity.py
          python controls/g4_p11_propagation.py
          python controls/g5_p11_entry_points.py

      - name: P12 data-independent response control
        run: python controls/g1_p12_radiological.py

      - name: P12 bounded input reliability
        run: python controls/g3_p12_parser_fuzz.py --smoke

      - name: Repository is self-contained
        run: python controls/g1_self_contained.py
