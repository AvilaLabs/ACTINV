name: publish Rust crates

# A signed v* tag publishes the matching workspace version. Each crate has its
# own job so a partial registry release can resume with GitHub's "re-run failed
# jobs" action without trying to overwrite an immutable version.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-rust-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tagged Rust release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Require tag and workspace versions to agree
        run: >-
          python3 -c "import os, pathlib, tomllib;
          version=tomllib.loads(pathlib.Path('Cargo.toml').read_text())['workspace']['package']['version'];
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}',
          (os.environ['GITHUB_REF_NAME'], version)"
      - name: Rust quality gates
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --all-features
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace --all-targets --all-features

  publish-data:
    name: Publish actinv-data
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: crates-io
      url: https://crates.io/crates/actinv-data
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Get short-lived crates.io credential
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
      - name: Publish actinv-data
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --package actinv-data

  publish-core:
    name: Publish actinv-core
    needs: publish-data
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: crates-io
      url: https://crates.io/crates/actinv-core
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Get short-lived crates.io credential
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
      - name: Publish actinv-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --package actinv-core

  publish-cli:
    name: Publish actinv-cli
    needs: publish-core
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: crates-io
      url: https://crates.io/crates/actinv-cli
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Get short-lived crates.io credential
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
      - name: Publish actinv-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --package actinv-cli
